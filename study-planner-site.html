        daysFull: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'],

          'January', 'February', 'March', 'April', 'May', 'June',

    function toIsoDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function addDaysIso(baseIso, delta) {
      const [y, m, d] = baseIso.split('-').map(Number);
      const dt = new Date(y, (m || 1) - 1, (d || 1) + delta);
      return toIsoDate(dt);
    }

    function formatDisplayDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    function ruleMatchesWeek(rule, week) {
      if (rule.weekMode === 'all') return week >= 1 && week <= TOTAL_WEEKS;
      if (rule.weekMode === 'single') return rule.weekStart === week;
      if (rule.weekMode === 'range') {
        const start = Math.min(rule.weekStart, rule.weekEnd);
        const end = Math.max(rule.weekStart, rule.weekEnd);
        return week >= start && week <= end;
      }
      if (rule.weekMode === 'specific') {
        return Array.isArray(rule.specificWeeks) && rule.specificWeeks.includes(week);
      }
      return false;
    }

    function resolveSlot(rules, dayIndex, pairIndex, week) {
      const matching = rules
        .filter((r) => r.dayIndex === dayIndex && r.pairIndex === pairIndex && ruleMatchesWeek(r, week))
        .sort((a, b) => b.updatedAt - a.updatedAt);
      return matching[0] || null;
    }

    function loadInitialState() {
      const fallback = {
        lang: 'ru',
        selectedWeek: 1,
        selectedDay: 0,
        tasks: [],
        rules: []
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          lang: ['ru', 'ky', 'en'].includes(parsed.lang) ? parsed.lang : 'ru',
          selectedWeek: typeof parsed.selectedWeek === 'number' && parsed.selectedWeek >= 1 && parsed.selectedWeek <= TOTAL_WEEKS ? parsed.selectedWeek : 1,
          selectedDay: typeof parsed.selectedDay === 'number' && parsed.selectedDay >= 0 && parsed.selectedDay <= 4 ? parsed.selectedDay : 0,
          tasks: Array.isArray(parsed.tasks) ? parsed.tasks : [],
          rules: Array.isArray(parsed.rules) ? parsed.rules : []
        };
      } catch {
        return fallback;
      }
    }

    function App() {
      const [state, setState] = useState(loadInitialState);
      const [activeTab, setActiveTab] = useState('home');
      const [settingsOpen, setSettingsOpen] = useState(false);

      const [taskModal, setTaskModal] = useState({ open: false, editing: null, prefillSubject: '' });
      const [formSubject, setFormSubject] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formAssigned, setFormAssigned] = useState('');
      const [formDue, setFormDue] = useState('');
      const [activeField, setActiveField] = useState('due');
      const [calYear, setCalYear] = useState(new Date().getFullYear());
      const [calMonth, setCalMonth] = useState(new Date().getMonth());

      const [editingSlot, setEditingSlot] = useState(null);
      const [slotSubject, setSlotSubject] = useState('');
      const [slotIsWindow, setSlotIsWindow] = useState(false);
      const [slotWeekMode, setSlotWeekMode] = useState('single');
      const [slotWeekStart, setSlotWeekStart] = useState(1);
      const [slotWeekEnd, setSlotWeekEnd] = useState(18);
      const [slotSpecificWeeks, setSlotSpecificWeeks] = useState([1]);

      const t = DICT[state.lang];
      const todayIso = useMemo(() => toIsoDate(new Date()), []);
      const tomorrowIso = useMemo(() => addDaysIso(todayIso, 1), [todayIso]);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {}
      }, [state]);

      const knownSubjects = useMemo(() => {
        const set = new Set();
        state.rules.forEach((r) => { if (!r.isWindow && r.subject && r.subject.trim()) set.add(r.subject.trim()); });
        state.tasks.forEach((tk) => { if (tk.subject && tk.subject.trim()) set.add(tk.subject.trim()); });
        return Array.from(set);
      }, [state.rules, state.tasks]);

      const activeTasks = useMemo(
        () => state.tasks.filter((x) => x.status !== 'completed').sort((a, b) => b.createdAt - a.createdAt),
        [state.tasks]
      );

      const todayTasks = useMemo(() => activeTasks.filter((x) => x.dueDate === todayIso), [activeTasks, todayIso]);
      const tomorrowTasks = useMemo(() => activeTasks.filter((x) => x.dueDate === tomorrowIso), [activeTasks, tomorrowIso]);
      const overdueTasks = useMemo(() => activeTasks.filter((x) => x.dueDate < todayIso), [activeTasks, todayIso]);

      const completedTasks = useMemo(
        () => state.tasks.filter((x) => x.status === 'completed').sort((a, b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt)),
        [state.tasks]
      );

      const openTaskModal = (task = null, prefill = '') => {
        const baseIso = task ? task.dueDate : todayIso;
        const [y, m] = baseIso.split('-').map(Number);
        setTaskModal({ open: true, editing: task, prefillSubject: prefill });
        setFormSubject(task ? task.subject : prefill);
        setFormDesc(task ? task.description : '');
        setFormAssigned(task ? task.assignedDate : todayIso);
        setFormDue(task ? task.dueDate : todayIso);
        setActiveField('due');
        setCalYear(y || new Date().getFullYear());
        setCalMonth((m || 1) - 1);
      };

      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!formSubject.trim() && !formDesc.trim()) return;
        const payload = {
          subject: formSubject.trim() || t.subject,
          description: formDesc.trim(),
          assignedDate: formAssigned || todayIso,
          dueDate: formDue || todayIso
        };
        setState((prev) => {
          if (taskModal.editing) {
            return {
              ...prev,
              tasks: prev.tasks.map((item) => item.id === taskModal.editing.id ? { ...item, ...payload } : item)
            };
          }
          const created = {
            id: `${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
            ...payload,
            status: 'pending',
            createdAt: Date.now()
          };
          return { ...prev, tasks: [created, ...prev.tasks] };
        });
        setTaskModal({ open: false, editing: null, prefillSubject: '' });
      };

      const setTaskStatus = (id, status) => {
        setState((prev) => ({
          ...prev,
          tasks: prev.tasks.map((item) => item.id === id ? {
            ...item,
            status,
            completedAt: status === 'completed' ? Date.now() : undefined
          } : item)
        }));
      };

      const toggleDone = (task) => {
        setTaskStatus(task.id, task.status === 'completed' ? 'pending' : 'completed');
      };

      const deleteTask = (id) => {
        setState((prev) => ({ ...prev, tasks: prev.tasks.filter((x) => x.id !== id) }));
        setTaskModal({ open: false, editing: null, prefillSubject: '' });
      };

      const openSlotEditor = (dayIndex, pairIndex) => {
        const current = resolveSlot(state.rules, dayIndex, pairIndex, state.selectedWeek);
        setEditingSlot({ dayIndex, pairIndex });
        setSlotSubject(current && !current.isWindow ? current.subject : '');
        setSlotIsWindow(current ? current.isWindow : false);
        setSlotWeekMode('single');
        setSlotWeekStart(state.selectedWeek);
        setSlotWeekEnd(TOTAL_WEEKS);
        setSlotSpecificWeeks([state.selectedWeek]);
      };

      const toggleSpecificWeek = (w) => {
        setSlotSpecificWeeks((prev) => {
          if (prev.includes(w)) {
            const next = prev.filter((x) => x !== w);
            return next.length > 0 ? next : [w];
          }
          return [...prev, w].sort((a, b) => a - b);
        });
      };

      const saveSlotRule = () => {
        if (!editingSlot) return;
        const trimmed = slotSubject.trim();
        if (!slotIsWindow && !trimmed) return;
        const rule = {
          id: `rule_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
          dayIndex: editingSlot.dayIndex,
          pairIndex: editingSlot.pairIndex,
          subject: slotIsWindow ? '' : trimmed,
          isWindow: slotIsWindow,
          weekMode: slotWeekMode,
          weekStart: Math.max(1, Math.min(TOTAL_WEEKS, slotWeekStart)),
          weekEnd: Math.max(1, Math.min(TOTAL_WEEKS, slotWeekEnd)),
          specificWeeks: slotSpecificWeeks.length > 0 ? slotSpecificWeeks : [state.selectedWeek],
          updatedAt: Date.now()
        };
        setState((prev) => ({ ...prev, rules: [...prev.rules, rule] }));
        setEditingSlot(null);
      };

      const calendarDays = useMemo(() => {
        const firstDay = new Date(calYear, calMonth, 1);
        const startWeekday = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < startWeekday; i++) cells.push({ day: null, iso: null });
        for (let d = 1; d <= daysInMonth; d++) {
          const mStr = String(calMonth + 1).padStart(2, '0');
          const dStr = String(d).padStart(2, '0');
          cells.push({ day: d, iso: `${calYear}-${mStr}-${dStr}` });
        }
        return cells;
      }, [calYear, calMonth]);

      const renderTaskCard = (task) => {
        const isDone = task.status === 'completed';
        const isOverdue = !isDone && task.dueDate < todayIso;

        return (
          <div key={task.id} className="rounded-[18px] bg-[#1C1C22] p-4 border border-white/[0.04] transition">
            <div className="flex items-start justify-between gap-3">
              <button type="button" onClick={() => openTaskModal(task)} className="flex items-start gap-3 text-left flex-1 min-w-0">
                <div className="w-11 h-11 rounded-2xl bg-[#272730] flex items-center justify-center shrink-0 text-[#8B7BFF] font-bold text-[15px]">
                  {(task.subject || 'Д').slice(0, 1).toUpperCase()}
                </div>
                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`font-semibold text-[16px] leading-snug ${isDone ? 'line-through text-zinc-400' : 'text-white'}`}>
                      {task.subject}
                    </span>
                    {task.status === 'in_progress' && (
                      <span className="text-[11px] px-2 py-0.5 rounded-full bg-amber-500/15 text-amber-300 font-medium">
                        {t.inProgressBadge}
                      </span>
                    )}
                  </div>
                  {task.description && (
                    <p className={`text-[14px] mt-0.5 break-words ${isDone ? 'line-through text-zinc-500' : 'text-zinc-300'}`}>
                      {task.description}
                    </p>
                  )}
                  <div className={`flex items-center gap-1.5 text-[12px] mt-2 ${isOverdue ? 'text-rose-400 font-medium' : 'text-zinc-400'}`}>
                    <span>
                      {task.dueDate === todayIso ? t.today : task.dueDate === tomorrowIso ? t.tomorrow : formatDisplayDate(task.dueDate)}
                    </span>
                  </div>
                </div>
              </button>

              <button
                type="button"
                onClick={() => toggleDone(task)}
                className={`w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 mt-1 transition ${
                  isDone ? 'bg-[#8B7BFF] border-[#8B7BFF] text-white' : 'border-zinc-500 hover:border-[#8B7BFF]'
                }`}
              >
                {isDone && <span className="text-[13px] font-bold">✓</span>}
              </button>
            </div>

            <div className="flex items-center gap-2 mt-3.5 pt-3 border-t border-white/[0.06]">
              <button
                type="button"
                onClick={() => setTaskStatus(task.id, 'completed')}
                className={`flex-1 py-2 px-3 rounded-xl text-[13px] font-medium transition ${
                  task.status === 'completed' ? 'bg-[#8B7BFF] text-white' : 'bg-[#25252E] text-zinc-200 hover:bg-[#2F2F3A]'
                }`}
              >
                {t.doneBtn}
              </button>
              <button
                type="button"
                onClick={() => setTaskStatus(task.id, task.status === 'in_progress' ? 'pending' : 'in_progress')}
                className={`flex-1 py-2 px-3 rounded-xl text-[13px] font-medium transition ${
                  task.status === 'in_progress'
                    ? 'bg-amber-500/25 text-amber-200 border border-amber-400/40'
                    : 'bg-[#25252E] text-zinc-300 hover:bg-[#2F2F3A]'
                }`}
              >
                {t.notFinishedBtn}
              </button>
            </div>
          </div>
        );
      };

      const stats = useMemo(() => {
        const total = state.tasks.length;
        const done = state.tasks.filter((x) => x.status === 'completed').length;
        const inProg = state.tasks.filter((x) => x.status === 'in_progress').length;
        const remaining = total - done;
        const counts = {};
        state.tasks.forEach((x) => {
          const key = (x.subject || '').trim();
          if (key) counts[key] = (counts[key] || 0) + 1;
        });
        let topSubject = t.noData;
        let maxCount = 0;
        Object.entries(counts).forEach(([subj, cnt]) => {
          if (cnt > maxCount) { maxCount = cnt; topSubject = subj; }
        });
        return { total, done, inProg, remaining, topSubject };
      }, [state.tasks, t.noData]);

      const exportJson = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `study-planner-${todayIso}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importJson = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            if (parsed && typeof parsed === 'object') {
              setState((prev) => ({
                ...prev,
                lang: ['ru', 'ky', 'en'].includes(parsed.lang) ? parsed.lang : prev.lang,
                selectedWeek: typeof parsed.selectedWeek === 'number' ? parsed.selectedWeek : prev.selectedWeek,
                tasks: Array.isArray(parsed.tasks) ? parsed.tasks : prev.tasks,
                rules: Array.isArray(parsed.rules) ? parsed.rules : prev.rules
              }));
            }
          } catch {}
        };
        reader.readAsText(file);
        e.target.value = '';

                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <button type="button" onClick={exportJson} className="py-3 px-3 rounded-2xl bg-[#1C1C22] text-[13px] font-medium border border-white/[0.05]">
                      {t.exportJson}
                    </button>
                    <label className="py-3 px-3 rounded-2xl bg-[#1C1C22] text-[13px] font-medium border border-white/[0.05] text-center cursor-pointer">
                      {t.importJson}
                      <input type="file" accept="application/json" onChange={importJson} className="hidden" />
                    </label>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      setState((prev) => ({ ...prev, tasks: [], rules: [], selectedWeek: 1, selectedDay: 0 }));
                      setSettingsOpen(false);
                    }}
                    className="w-full py-3 px-4 rounded-2xl bg-rose-500/15 text-rose-300 text-[13px] font-semibold"
                  >
                    {t.resetAll}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
